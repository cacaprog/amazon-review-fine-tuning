name: dissatisfaction-classifier
channels:
  - pytorch
  - nvidia
  - huggingface
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip

  # Deep learning
  - pytorch::pytorch=2.2.2
  - pytorch::torchvision
  - pytorch::torchaudio
  - pytorch::pytorch-cuda=12.1

  - pip:
    # HuggingFace ecosystem
    - transformers==4.40.1
    - peft==0.10.0
    - datasets==2.19.1
    - huggingface-hub==0.22.2
    - accelerate==0.29.3
    - safetensors==0.4.3

    # Explainability
    - captum==0.7.0
    - shap==0.45.0

    # ML / science
    - scikit-learn==1.4.2
    - numpy==1.26.4
    - pandas==2.2.2
    - scipy==1.13.0

    # Configuration
    - omegaconf==2.3.0

    # Data validation
    - pandera==0.19.3

    # Experiment tracking
    - wandb==0.16.6

    # Notebook / viz
    - jupyter==1.0.0
    - jupyterlab==4.1.6
    - matplotlib==3.8.4
    - seaborn==0.13.2
    - ipywidgets==8.1.2

    # Demo
    - gradio==4.27.0

    # Dev
    - pytest==8.1.1
    - black==24.4.2
    - isort==5.13.2

    # Calibration persistence
    - joblib==1.4.0

    # Parquet I/O
    - pyarrow==16.0.0
