[project]
name = "dissatisfaction-classifier"
version = "0.1.0"
description = "Critical Dissatisfaction Early Warning — transformer classifier on Amazon reviews"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
prepare-reviews = "dissatisfaction_classifier.data.etl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dissatisfaction_classifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
