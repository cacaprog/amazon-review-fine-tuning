[project]
name = "dissatisfaction-classifier"
version = "0.1.0"
description = "Critical Dissatisfaction Early Warning — transformer classifier on Amazon reviews"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # HuggingFace ecosystem
    "transformers==4.40.1",
    "peft==0.10.0",
    "datasets==2.19.1",
    "huggingface-hub==0.22.2",
    "accelerate==0.29.3",
    "safetensors==0.4.3",
    # PyTorch — index configured in [tool.uv.sources]
    "torch==2.2.2",
    # Explainability
    "captum==0.7.0",
    "shap==0.45.0",
    # ML / science
    "scikit-learn==1.4.2",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scipy==1.13.0",
    # Configuration
    "omegaconf==2.3.0",
    # Data validation
    "pandera==0.19.3",
    # Experiment tracking
    "wandb==0.16.6",
    # Persistence
    "joblib==1.4.0",
    # Parquet I/O
    "pyarrow==16.0.0",
    # Demo
    "gradio==4.27.0",
]

[project.scripts]
prepare-reviews = "dissatisfaction_classifier.data.etl:main"

[dependency-groups]
dev = [
    "pytest==8.1.1",
    "black==24.4.2",
    "isort==5.13.2",
    "jupyterlab==4.1.6",
    "matplotlib==3.8.4",
    "seaborn==0.13.2",
    "ipywidgets==8.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dissatisfaction_classifier"]

# ── PyTorch CUDA index ────────────────────────────────────────────────────────
[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

# ── Tool config ───────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
